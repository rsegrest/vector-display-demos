<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rick Segrest's travel map on a vector globe: countries and US states visited, seen and lived in, hatched in status colors." />
    <title>Travel Globe</title>
  </head>
  <body>
    <canvas id="screen" tabindex="0" aria-label="A rotating vector globe. Countries and US states Rick has visited are filled with colored lines; the full list of places follows as text."></canvas>
    <p class="visually-hidden">Keys: arrows rotate, plus and minus zoom, left and right brackets step through places, W world view, U United States, Enter opens the selected place's blog post, space toggles auto-rotation, H help, F fullscreen, Escape clears the selection.</p>
    <script type="module" src="../src/pages/travel-globe.ts"></script>
  </body>
</html>
